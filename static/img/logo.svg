<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <rect width="100" height="100" rx="18" fill="#1e1b4b"/>
  <!-- Book pages -->
  <rect x="28" y="22" width="44" height="56" rx="4" fill="none" stroke="#a78bfa" stroke-width="2.5"/>
  <rect x="24" y="26" width="44" height="56" rx="4" fill="#2d2560" stroke="#8b5cf6" stroke-width="2"/>
  <!-- Lines representing text -->
  <line x1="33" y1="40" x2="59" y2="40" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <line x1="33" y1="49" x2="59" y2="49" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <line x1="33" y1="58" x2="52" y2="58" stroke="#7c3aed" stroke-width="2" stroke-linecap="round"/>
  <line x1="33" y1="67" x2="59" y2="67" stroke="#a78bfa" stroke-width="2" stroke-linecap="round"/>
  <!-- Spine highlight -->
  <line x1="24" y1="30" x2="24" y2="76" stroke="#c4b5fd" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Dot accent -->
  <circle cx="70" cy="30" r="8" fill="#7c3aed"/>
  <text x="70" y="34" text-anchor="middle" font-size="10" font-weight="bold" fill="#fff">&lt;/&gt;</text>
</svg>
